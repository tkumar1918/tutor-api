# Test profile: H2 in-memory (Hibernate auto-detects the dialect — don't override)
spring.datasource.url=jdbc:h2:mem:tutor-api-test;MODE=MYSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0LXB1cnBvc2VzLW9ubHktbm90LWZvci1wcm9kLXVzZS1hYmNkMTIzNDU2Nzg5MA==

# Don't seed data.sql in tests — they assume an empty database.
spring.sql.init.mode=never
app.jwt.expiration-ms=3600000
app.jwt.issuer=tutor-api
app.cors.allowed-origins=*

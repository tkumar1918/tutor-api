# =============================================================================
# Prod profile — strict schema validation, minimal logs, no seed data, no Swagger.
#
# Datasource credentials are REQUIRED from the environment; the localhost
# defaults in the base file are never used because the platform always sets them.
# =============================================================================

# Never let Hibernate modify a production schema — validate only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Don't run data.sql in production.
spring.sql.init.mode=never

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO

# Swagger off in prod.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# =============================================================================
# Dev profile — verbose logging, auto-DDL, seed data, Swagger on.
#
# Only *behavioural* overrides live here. Datasource credentials still come from
# the environment (.env via compose, or the localhost defaults in the base file).
# =============================================================================

# Let Hibernate create/update tables automatically in dev.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG

# Seed dummy data on startup (data.sql in src/main/resources).
# defer-datasource-initialization makes data.sql run AFTER Hibernate creates the
# tables. Every INSERT in data.sql is idempotent (WHERE NOT EXISTS), so it's safe
# across restarts.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Swagger UI on in dev.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

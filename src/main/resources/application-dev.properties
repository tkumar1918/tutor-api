# Dev profile: verbose logging, permissive CORS, SQL traces
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG

# Seed dummy data on startup (data.sql in src/main/resources).
# defer-datasource-initialization makes data.sql run AFTER Hibernate creates the tables.
# Every INSERT in data.sql is idempotent (WHERE NOT EXISTS), so it's safe across restarts.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

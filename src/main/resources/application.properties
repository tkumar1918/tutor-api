spring.application.name=tutor-api
spring.profiles.active=${SPRING_PROFILE:dev}

# Datasource — Postgres. Default points at local Postgres on :5432; override
# SPRING_DATASOURCE_URL for Supabase, RDS, or any other host. Supabase example:
#   jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
# (the pooler on :6543 also works; transaction-mode is fine for stateless apps like this).
# Note: unlike MySQL, Postgres won't auto-create the database — it must exist beforehand.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tutor_api}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtbWUtdG8tYS1sb25nLXJhbmRvbS1iYXNlNjQtc3RyaW5nLWZvci1wcm9kdWN0aW9u}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=tutor-api

# OpenAPI / Swagger UI
# Setting these explicitly (vs. relying on the default true) silences the
# "endpoint is enabled by default" warning at startup. Override to false in
# application-prod.properties when running against a real production host.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

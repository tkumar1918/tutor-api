spring.application.name=tutor-api
spring.profiles.active=${SPRING_PROFILE:dev}

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/tutor_api?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtbWUtdG8tYS1sb25nLXJhbmRvbS1iYXNlNjQtc3RyaW5nLWZvci1wcm9kdWN0aW9u}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=tutor-api

# OpenAPI / Swagger UI
# Setting these explicitly (vs. relying on the default true) silences the
# "endpoint is enabled by default" warning at startup. Override to false in
# application-prod.properties when running against a real production host.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# =============================================================================
# Base configuration — shared by ALL profiles.
#
# No secrets live here. Every sensitive or host-specific value is read from an
# environment variable via ${VAR:default}; see .env.example for the full list.
# The active profile (dev/prod) layers its overrides on top of this file.
# =============================================================================

spring.application.name=tutor-api
spring.profiles.active=${SPRING_PROFILE:dev}

# --- Datasource ---------------------------------------------------------------
# Required from the environment — NO defaults on purpose (fail-fast). If .env
# isn't loaded the app refuses to start instead of silently connecting to a
# wrong/local database. See .env.example for the localhost shape to use locally.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# --- JPA / Hibernate (common) -------------------------------------------------
spring.jpa.open-in-view=false

# --- Security / JWT -----------------------------------------------------------
# JWT_SECRET has no default on purpose: the app must fail fast if it's unset.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=tutor-api

# --- CORS ---------------------------------------------------------------------
# Comma-separated allowed origins. Default covers local frontends; prod sets
# CORS_ALLOWED_ORIGINS to the real domain(s).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# --- OpenAPI / Swagger (paths common to all profiles; toggled per profile) ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
